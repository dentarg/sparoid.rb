name: Binaries

# sparoid compiled with Spinel (spinel/README.md): one executable per
# platform, attached to the GitHub release of a v* tag.

on:
  push:
    tags:
      - 'v*'
  pull_request:
    paths:
      - .github/workflows/binaries.yml
      - lib/**
      - spinel/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux-x86_64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: darwin-x86_64
          - runner: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - name: Check that the tag is the gem's version
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version=$(sed -n 's/^ *VERSION = "\(.*\)"$/\1/p' lib/sparoid/version.rb)
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME is not v$version (lib/sparoid/version.rb)"
            exit 1
          fi
      - name: Build in ubuntu:26.04
        if: runner.os == 'Linux'
        run: docker run --rm -v "$PWD:/src" -w /src ubuntu:26.04 bash spinel/build-in-ubuntu.sh
      - name: Build
        if: runner.os == 'macOS'
        run: |
          brew list openssl@3 >/dev/null 2>&1 || brew install openssl@3
          bash spinel/install-spinel.sh
          bash spinel/build.sh
      - uses: actions/upload-artifact@v7
        with:
          name: sparoid-${{ matrix.platform }}
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs:
      - build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v8
        with:
          pattern: sparoid-*
          path: dist
          merge-multiple: true
      - name: Attach the binaries to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat dist/*.sha256 > dist/SHA256SUMS
          spinel=$(cat spinel/spinel-version)
          if ! gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            cat > "$RUNNER_TEMP/notes.md" <<EOF
          sparoid $GITHUB_REF_NAME compiled with [Spinel](https://github.com/matz/spinel/commit/$spinel)
          into one executable per platform, no Ruby needed:

          - Linux (x86_64, arm64): statically linked, any distribution (glibc or musl)
          - macOS (x86_64, arm64): OpenSSL linked in, the rest from the system
          EOF
            gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md"
          fi
          gh release upload "$GITHUB_REF_NAME" dist/*.tar.gz dist/SHA256SUMS --clobber
